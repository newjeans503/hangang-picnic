<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>망원 한강 점심 소풍</title><meta name="claude:viewport-fit-sides" content="cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Nanum+Pen+Script&family=IBM+Plex+Mono:wght@500&display=swap"><meta property="og:title" content="망원 한강 점심 소풍"><meta property="og:description" content="10월 15일(목) 11:45, 버거 들고 망원한강공원 가요!"><meta name="description" content="10월 15일(목) 11:45, 버거 들고 망원한강공원 가요!"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body><style id="page-style">
/* Layout: 돗자리 체크무늬 띠를 두른 세로 초대장 카드. 머리말은 가운데, 본문은 왼쪽 정렬 */
:root {
  --sky: #e6edf2;        /* 가을 한강 하늘 */
  --paper: #fdfdfb;
  --ink: #1d2b45;        /* 강물 남색 */
  --soft: #55627a;
  --ginkgo: #e2ad1f;     /* 은행잎 */
  --ginkgo-ink: #8a6200;
  --grass: #3f7a46;
  --rule: #d6dde6;
  --check: rgba(226,173,31,.38);
  --map-filter: none;
  --font-display: "Gowun Batang", "Nanum Myeongjo", Georgia, serif;
  --font-hand: "Nanum Pen Script", "Gowun Batang", cursive;
  --font-body: "Gowun Batang", "Apple SD Gothic Neo", "Malgun Gothic", serif;
  --font-mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --sky: #111826; --paper: #1a2333; --ink: #e8edf5; --soft: #a9b4c7;
    --ginkgo: #f0c246; --ginkgo-ink: #f0c246; --grass: #7cc285; --rule: #2e3a50;
    --check: rgba(240,194,70,.28); --map-filter: invert(.9) hue-rotate(180deg) saturate(.5) brightness(.95); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --sky: #111826; --paper: #1a2333; --ink: #e8edf5; --soft: #a9b4c7;
  --ginkgo: #f0c246; --ginkgo-ink: #f0c246; --grass: #7cc285; --rule: #2e3a50;
  --check: rgba(240,194,70,.28); --map-filter: invert(.9) hue-rotate(180deg) saturate(.5) brightness(.95); color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--sky); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.65; }
.page {
  padding-block: 32px 56px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.card { max-width: 620px; margin: 0 auto; background: var(--paper); border-radius: 6px; overflow: hidden; box-shadow: 0 18px 40px -24px rgba(29,43,69,.45); }
.gingham {
  height: 26px;
  background-color: var(--paper);
  background-image:
    linear-gradient(90deg, var(--check) 50%, transparent 50%),
    linear-gradient(0deg, var(--check) 50%, transparent 50%);
  background-size: 26px 26px;
}
.inner { padding: 36px 28px 40px; display: grid; gap: 36px; }
@media (max-width: 480px) { .inner { padding: 28px 18px 32px; gap: 30px; } }

.hero { text-align: center; display: grid; gap: 10px; justify-items: center; }
.eyebrow { font-family: var(--font-mono); font-size: 12px; letter-spacing: .22em; color: var(--soft); }
.hero h1 { font-family: var(--font-display); font-weight: 700; font-size: clamp(34px, 8vw, 48px); line-height: 1.2; margin: 0; text-wrap: balance; }
.hand { font-family: var(--font-hand); font-size: 30px; line-height: 1.1; color: var(--ginkgo-ink); }
.date { display: inline-flex; flex-wrap: wrap; justify-content: center; gap: 4px 14px; font-size: 17px; }
.date b { font-weight: 700; }
.leaf { width: 44px; height: 44px; }

h2 { font-family: var(--font-display); font-size: 21px; margin: 0; display: flex; align-items: baseline; gap: 10px; }
h2 .hand { font-size: 24px; }
section { display: grid; gap: 14px; }

.guests { display: flex; flex-wrap: wrap; gap: 10px; list-style: none; margin: 0; padding: 0; }
.guests li { border: 1px solid var(--rule); border-radius: 999px; padding: 7px 16px; display: grid; line-height: 1.3; }
.guests b { font-size: 17px; }
.guests small { font-size: 12px; color: var(--soft); }

.timeline { list-style: none; margin: 0; padding: 0; display: grid; }
.timeline li { display: grid; grid-template-columns: 64px 1fr; gap: 14px; padding: 10px 0; border-top: 1px dashed var(--rule); }
.timeline li:first-child { border-top: 0; }
.timeline time { font-family: var(--font-mono); font-size: 14px; color: var(--soft); font-variant-numeric: tabular-nums; padding-top: 2px; }
.timeline li.hi span { font-weight: 700; }
.timeline li.hi time { color: var(--ginkgo-ink); }

.places { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.place { border: 1px solid var(--rule); border-radius: 8px; padding: 14px 16px; display: grid; gap: 4px; min-width: 0; }
.place .tag { font-family: var(--font-mono); font-size: 11px; letter-spacing: .14em; color: var(--soft); }
.place b { font-size: 18px; }
.place span { font-size: 14px; color: var(--soft); }
.place a { font-size: 14px; color: var(--ink); text-underline-offset: 3px; justify-self: start; }

.weather { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.wx { text-align: center; border-radius: 8px; padding: 10px 4px; background: var(--sky); display: grid; gap: 2px; }
.wx time { font-family: var(--font-mono); font-size: 12px; color: var(--soft); }
.wx b { font-size: 18px; }
.wx span { font-size: 13px; }
.wx.wet span { color: var(--ginkgo-ink); font-weight: 700; }
.note { margin: 0; font-size: 14px; color: var(--soft); }

.list { list-style: none; margin: 0; padding: 0; display: grid; }
.item { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 12px; padding: 10px 0; border-top: 1px solid var(--rule); }
.item:first-child { border-top: 0; }
.item input[type=checkbox] { width: 22px; height: 22px; accent-color: var(--grass); margin: 0; cursor: pointer; }
.item label { cursor: pointer; min-width: 0; line-height: 1.35; }
.item .qty { font-family: var(--font-mono); font-size: 13px; color: var(--soft); margin-left: 6px; }
.item .rec { font-size: 11px; border: 1px solid var(--ginkgo); color: var(--ginkgo-ink); border-radius: 4px; padding: 1px 6px; margin-left: 6px; vertical-align: 2px; }
.item.done label { text-decoration: line-through; text-decoration-color: var(--grass); color: var(--soft); }
.item select { font-family: var(--font-body); font-size: 14px; padding: 5px 8px; border-radius: 6px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); max-width: 96px; }
.item select.unset { color: var(--ginkgo-ink); border-color: var(--ginkgo); }
.status { font-size: 13px; color: var(--soft); margin: 0; min-height: 1.5em; }
.progress { font-family: var(--font-hand); font-size: 24px; color: var(--grass); margin-left: auto; }

.ps { border-top: 1px solid var(--rule); padding-top: 20px; display: grid; gap: 6px; }
.ps p { margin: 0; font-size: 14px; color: var(--soft); }
.ps .hand { font-size: 26px; }
input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--ginkgo); outline-offset: 2px; }
.map { border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: var(--sky); }
.map svg { display: block; width: 100%; height: auto; }
.mp-tiles { filter: var(--map-filter); }
.mp-casing { fill: none; stroke: #fff; stroke-width: 9; stroke-linejoin: round; stroke-linecap: round; opacity: .9; }
.mp-route { fill: none; stroke: #c98a00; stroke-width: 5; stroke-linejoin: round; stroke-linecap: round; }
.mp-pin circle { fill: #1d2b45; stroke: #fff; stroke-width: 3; }
.mp-num { fill: #fff; font: 700 13px var(--font-mono); text-anchor: middle; }
.mp-label, .mp-sub, .mp-blabel, .mp-attr { paint-order: stroke; stroke: #fff; stroke-linejoin: round; }
.mp-label { font: 700 16px var(--font-body); fill: #1d2b45; stroke-width: 5px; }
.mp-sub { font: 500 12px var(--font-mono); fill: #8a6200; stroke-width: 4px; }
.mp-b rect { fill: #fff; stroke: #1d2b45; stroke-width: 2.5; }
.mp-blabel { font: 700 12px var(--font-body); fill: #1d2b45; stroke-width: 4px; }
.mp-attr { font: 10px var(--font-body); fill: #333; stroke-width: 3px; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 16px; font-size: 13px; color: var(--soft); margin: 0; }
.legend i { display: inline-block; width: 18px; height: 5px; border-radius: 3px; background: #c98a00; vertical-align: 3px; margin-right: 6px; }
.legend i.sq { width: 11px; height: 11px; background: var(--paper); border: 2px solid var(--ink); border-radius: 3px; vertical-align: -1px; }
@media (max-width: 400px) { .weather { grid-template-columns: repeat(2, 1fr); } }
